name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 tag（如 v2.0.1）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build arm64 DMG and publish GitHub Release
    # xcode-27 镜像 = macOS 27（arm64）+ Xcode 27；排队异常时可临时换成 macos-26
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag matches Info.plist
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="${tag#v}"
          plist_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          plist_build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Info.plist)
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "APP_VERSION=$plist_version" >> "$GITHUB_ENV"
          echo "ASSET_DMG=dist/MouseBatteryBridge-$plist_version.dmg" >> "$GITHUB_ENV"
          echo "tag: $tag"
          echo "Info.plist: $plist_version (build $plist_build)"
          echo "runner: macOS $(sw_vers -productVersion) $(uname -m)"
          if [ "$version" != "$plist_version" ]; then
            echo "::error::tag $tag 与 Info.plist 的 CFBundleShortVersionString $plist_version 不一致，先改版本号再发版"
            exit 1
          fi

      - name: Run tests
        run: ./test.sh

      - name: Build DMG
        run: ./dmg.sh

      - name: Package app zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/MouseBatteryBridge.app dist/MouseBatteryBridge.app.zip

      - name: Verify artifacts
        run: |
          set -euo pipefail
          binary="dist/MouseBatteryBridge.app/Contents/MacOS/MouseBatteryBridge"
          archs=$(lipo -archs "$binary")
          echo "binary archs: $archs"
          if [ "$archs" != "arm64" ]; then
            echo "::error::产物不是纯 arm64（$archs）"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 dist/MouseBatteryBridge.app
          hdiutil verify "$ASSET_DMG"
          ls -lh dist

      - name: Extract release notes from CHANGELOG
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          changelog="CHANGELOG.md"
          : > "$notes"
          # 早于 CHANGELOG.md 的旧标签，回退到默认分支上的版本
          if [ ! -f "$changelog" ]; then
            echo "tag 中不含 CHANGELOG.md，尝试使用 $DEFAULT_BRANCH 上的版本" >&2
            git fetch --depth=1 origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
            if git cat-file -e "FETCH_HEAD:CHANGELOG.md" 2>/dev/null; then
              changelog="$RUNNER_TEMP/CHANGELOG.md"
              git show "FETCH_HEAD:CHANGELOG.md" > "$changelog"
            fi
          fi
          if [ -f "$changelog" ]; then
            awk -v ver="$APP_VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$changelog" > "$notes"
          fi
          if grep -q '[^[:space:]]' "$notes"; then
            echo "HAS_NOTES=1" >> "$GITHUB_ENV"
            cat "$notes"
          else
            echo "HAS_NOTES=0" >> "$GITHUB_ENV"
            echo "CHANGELOG.md 缺少 $APP_VERSION 的条目，将使用自动生成的更新说明" >&2
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=("$ASSET_DMG" dist/MouseBatteryBridge.app.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传产物"
            gh release upload "$TAG" "${assets[@]}" --clobber
          elif [ "$HAS_NOTES" = "1" ]; then
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "### MouseBatteryBridge $APP_VERSION"
            echo ""
            echo "- tag：\`$TAG\`"
            echo "- 产物：\`$ASSET_DMG\`、\`MouseBatteryBridge.app.zip\`"
            echo "- Release：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
